name: Publicar edición en español

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "build_spanish_site.py"
      - "requirements.txt"
      - "site/**"
      - "translations/es-rioplatense/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construir sitio
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Generar edición en español
        run: python build_spanish_site.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar únicamente la edición en español
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-es

  deploy:
    name: Publicar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
